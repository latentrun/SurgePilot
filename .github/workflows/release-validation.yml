name: Release Validation

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "validation-*"

permissions:
  contents: read
  packages: read

env:
  CANONICAL_REPOSITORY: latentrun/SurgePilot
  API_IMAGE: ghcr.io/latentrun/surgepilot-api
  WEB_IMAGE: ghcr.io/latentrun/surgepilot-web
  DEMO_IMAGE: ghcr.io/latentrun/surgepilot-demo-node
  VALIDATION_VERSION: v0.0.0

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "11.3.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: make setup
      - name: Install browser runtime for rendered metadata checks
        run: pnpm --filter @surgepilot/docs exec playwright install --with-deps chromium
      - run: make generate-contracts
      - run: make verify

  pr-native:
    if: github.event_name == 'pull_request'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Build and verify native Runtime
        run: |
          python scripts/run_runtime_builder.py \
            --output-dir "$RUNNER_TEMP/runtime" \
            --build-dir "$RUNNER_TEMP/runtime-build" \
            --cache-dir "$RUNNER_TEMP/runtime-cache" \
            --env-file "$RUNNER_TEMP/runtime/runtime.env" \
            --fixed-version "v0.0.0"
      - name: Verify native Ubuntu 24.04 and Debian 12 compatibility
        env:
          RUNTIME_COMPAT_RUNTIME_VERSION: ${{ env.VALIDATION_VERSION }}
          RUNTIME_COMPAT_RUNTIME_ARTIFACT_DIR: ${{ runner.temp }}/runtime
          RUNTIME_COMPAT_RUNTIME_BUILD_DIR: ${{ runner.temp }}/runtime-build
          RUNTIME_COMPAT_RUNTIME_CACHE_DIR: ${{ runner.temp }}/runtime-cache
          RUNTIME_COMPAT_RUNTIME_ENV_FILE: ${{ runner.temp }}/runtime/runtime.env
        run: make verify-runtime-compat
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build native application images without publication
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker buildx build --platform "$PLATFORM" --load \
            --build-arg SURGEPILOT_VERSION="validation-$GITHUB_SHA" \
            --build-arg SURGEPILOT_REVISION="$GITHUB_SHA" \
            --tag "surgepilot-validation-api:$GITHUB_SHA-$ARCH" --file apps/api/Dockerfile .
          docker buildx build --platform "$PLATFORM" --load \
            --build-arg SURGEPILOT_VERSION="validation-$GITHUB_SHA" \
            --build-arg SURGEPILOT_REVISION="$GITHUB_SHA" \
            --tag "surgepilot-validation-web:$GITHUB_SHA-$ARCH" --file apps/web/Dockerfile .
          docker buildx build --platform "$PLATFORM" --load \
            --build-arg SURGEPILOT_VERSION="validation-$GITHUB_SHA" \
            --build-arg SURGEPILOT_REVISION="$GITHUB_SHA" \
            --tag "surgepilot-validation-demo-node:$GITHUB_SHA-$ARCH" \
            --file infra/docker/demo-load-node/Dockerfile .

  pr-installer-smoke:
    if: github.event_name == 'pull_request'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Run cross-platform installer contract smoke
        run: |
          uv sync --all-packages --all-groups
          uv run --all-packages pytest -q \
            tests/test_release_installer.py \
            tests/test_build_release_bundle.py \
            tests/contract/test_p2_05_distribution.py
          sh -n infra/release/install.sh infra/release/surgepilot

  tag-preflight:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/validation-')
    runs-on: ubuntu-24.04
    steps:
      - name: Validate canonical repository
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$CANONICAL_REPOSITORY" || {
            echo "Validation publication must run from $CANONICAL_REPOSITORY after the repository rename; current repository is $GITHUB_REPOSITORY." >&2
            exit 1
          }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate trusted main tag and public package bootstrap
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin main:refs/remotes/origin/main
          suffix=${GITHUB_REF_NAME#validation-}
          [[ "$GITHUB_REF_NAME" =~ ^validation-[0-9a-f]{12,40}$ ]] || {
            echo "Validation tag must use validation-<12-to-40 lowercase commit hex>." >&2
            exit 1
          }
          [[ "$GITHUB_SHA" == "$suffix"* ]] || {
            echo "Validation tag suffix must be a prefix of the tagged commit SHA." >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "Validation tags may reference only commits already contained in main." >&2
            exit 1
          }

          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          printf '{"auths":{}}\n' > "$anonymous_config/config.json"
          for image in "$API_IMAGE" "$WEB_IMAGE" "$DEMO_IMAGE"; do
            if ! DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect "$image:package-bootstrap" >/dev/null; then
              echo "GHCR package $image is not ready for public validation." >&2
              echo "Run Release Package Bootstrap and set the package visibility to Public." >&2
              exit 1
            fi
          done

  tag-native:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/validation-')
    needs: [verify, tag-preflight]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build native validation Runtime
        run: |
          python scripts/run_runtime_builder.py \
            --output-dir "$RUNNER_TEMP/runtime" \
            --build-dir "$RUNNER_TEMP/runtime-build" \
            --cache-dir "$RUNNER_TEMP/runtime-cache" \
            --env-file "$RUNNER_TEMP/runtime/runtime.env" \
            --fixed-version "v0.0.0"
      - name: Verify native Ubuntu 24.04 and Debian 12 compatibility
        env:
          RUNTIME_COMPAT_RUNTIME_VERSION: ${{ env.VALIDATION_VERSION }}
          RUNTIME_COMPAT_RUNTIME_ARTIFACT_DIR: ${{ runner.temp }}/runtime
          RUNTIME_COMPAT_RUNTIME_BUILD_DIR: ${{ runner.temp }}/runtime-build
          RUNTIME_COMPAT_RUNTIME_CACHE_DIR: ${{ runner.temp }}/runtime-cache
          RUNTIME_COMPAT_RUNTIME_ENV_FILE: ${{ runner.temp }}/runtime/runtime.env
        run: make verify-runtime-compat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}/runtime/surgepilot-runtime-*
          if-no-files-found: error
          retention-days: 1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push native validation images
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          TAG="validation-$GITHUB_SHA"
          ARCH_TAG="$TAG-${{ matrix.arch }}"
          docker buildx build --platform "$PLATFORM" --push \
            --build-arg SURGEPILOT_VERSION="$TAG" \
            --build-arg SURGEPILOT_REVISION="$GITHUB_SHA" \
            --tag "$API_IMAGE:$ARCH_TAG" --file apps/api/Dockerfile .
          docker buildx build --platform "$PLATFORM" --push \
            --build-arg SURGEPILOT_VERSION="$TAG" \
            --build-arg SURGEPILOT_REVISION="$GITHUB_SHA" \
            --tag "$WEB_IMAGE:$ARCH_TAG" --file apps/web/Dockerfile .
          docker buildx build --platform "$PLATFORM" --push \
            --build-arg SURGEPILOT_VERSION="$TAG" \
            --build-arg SURGEPILOT_REVISION="$GITHUB_SHA" \
            --tag "$DEMO_IMAGE:$ARCH_TAG" --file infra/docker/demo-load-node/Dockerfile .

  tag-indexes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/validation-')
    needs: tag-native
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create validation indexes and record immutable digests
        run: |
          set -euo pipefail
          TAG="validation-$GITHUB_SHA"
          printf '{\n' > image-digests.json
          separator=''
          for item in "api:$API_IMAGE" "web:$WEB_IMAGE" "demoNode:$DEMO_IMAGE"; do
            key=${item%%:*}
            image=${item#*:}
            docker buildx imagetools create \
              --tag "$image:$TAG" \
              "$image:$TAG-amd64" \
              "$image:$TAG-arm64"
            inspect=$(docker buildx imagetools inspect "$image:$TAG" --format '{{json .Manifest}}')
            digest=$(printf '%s' "$inspect" | jq -r .digest)
            docker buildx imagetools inspect "$image@$digest" > image-index.txt
            grep -q 'linux/amd64' image-index.txt
            grep -q 'linux/arm64' image-index.txt
            printf '%s  "%s": {"repository": "%s", "digest": "%s"}' \
              "$separator" "$key" "$image" "$digest" >> image-digests.json
            separator=$',\n'
          done
          printf '\n}\n' >> image-digests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-image-digests
          path: image-digests.json
          retention-days: 1

  tag-bundle:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/validation-')
    needs: tag-indexes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: validation-runtime-*
          path: validation-inputs/runtime
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-image-digests
          path: validation-inputs
      - name: Assemble and validate digest-pinned validation bundle
        run: |
          set -euo pipefail
          python -m scripts.build_release_bundle \
            --version "v0.0.0" \
            --revision "$GITHUB_SHA" \
            --images-json validation-inputs/image-digests.json \
            --runtime-directory validation-inputs/runtime \
            --output-directory validation-output
          sh -n validation-output/install.sh
          (cd validation-output && sha256sum -c surgepilot-v0.0.0.tar.gz.sha256)
          tar -xzf validation-output/surgepilot-v0.0.0.tar.gz -C validation-output
          sh -n validation-output/surgepilot/surgepilot
          cp validation-output/surgepilot/.env.example validation-output/surgepilot/.env
          RUNNER_INTERNAL_TOKEN=validation-runner-token \
          SSH_CREDENTIAL_ENCRYPTION_KEY=MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= \
          docker compose --env-file validation-output/surgepilot/.env \
            -f validation-output/surgepilot/compose/docker-compose.yml --profile demo config >/dev/null
          ! tar -tzf validation-output/surgepilot-v0.0.0.tar.gz | \
            grep -E '(^|/)(\.env$|\.surgepilot/|apps/|packages/ai-skills/|surgepilot-runtime-.*\.tar\.gz$)'
          cp validation-inputs/runtime/surgepilot-runtime-* validation-output/
          rm -rf validation-output/surgepilot
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-release-bundle
          path: validation-output/surgepilot-v0.0.0.tar.gz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-release-assets
          path: validation-output/*
          if-no-files-found: error
          retention-days: 1

  tag-installer-smoke:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/validation-')
    needs: tag-bundle
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-release-assets
          path: validation-release-assets
      - name: Install through the validation script without host changes
        run: |
          set -eu
          asset_port=18765
          python3 -m http.server "$asset_port" --bind 127.0.0.1 \
            --directory validation-release-assets >"$RUNNER_TEMP/surgepilot-installer-http.log" 2>&1 &
          asset_server_pid=$!
          trap 'kill "$asset_server_pid" 2>/dev/null || true' EXIT
          HOME="$RUNNER_TEMP/surgepilot-home"
          XDG_DATA_HOME="$RUNNER_TEMP/surgepilot-data"
          export HOME XDG_DATA_HOME
          mkdir -p "$HOME"
          printf 'preserve-profile\n' > "$HOME/.profile"
          cp "$HOME/.profile" "$RUNNER_TEMP/profile.before"
          installer_url="http://127.0.0.1:$asset_port/install.sh"
          attempt=0
          until curl -fsSL "$installer_url" -o /dev/null; do
            attempt=$((attempt + 1))
            [ "$attempt" -lt 20 ] || exit 1
            sleep 1
          done
          curl -fsSL "$installer_url" | \
            SURGEPILOT_INSTALLER_RELEASE_BASE_URL="http://127.0.0.1:$asset_port" sh
          "$HOME/.local/bin/surgepilot" --help
          cmp "$HOME/.profile" "$RUNNER_TEMP/profile.before"
          test ! -e /usr/local/bin/surgepilot

  tag-smoke:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/validation-')
    needs: tag-bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validation-release-assets
          path: validation-release-assets
      - name: Verify anonymous digest pulls and native release stack
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          asset_port=18765
          python3 -m http.server "$asset_port" --bind 127.0.0.1 \
            --directory validation-release-assets >"$RUNNER_TEMP/surgepilot-stack-http.log" 2>&1 &
          asset_server_pid=$!
          trap 'kill "$asset_server_pid" 2>/dev/null || true' EXIT
          HOME="$RUNNER_TEMP/surgepilot-home"
          XDG_DATA_HOME="$RUNNER_TEMP/surgepilot-data"
          export HOME XDG_DATA_HOME
          mkdir -p "$HOME"
          installer_url="http://127.0.0.1:$asset_port/install.sh"
          attempt=0
          until curl -fsSL "$installer_url" -o /dev/null; do
            attempt=$((attempt + 1))
            [ "$attempt" -lt 20 ] || exit 1
            sleep 1
          done
          curl -fsSL "$installer_url" | \
            SURGEPILOT_INSTALLER_RELEASE_BASE_URL="http://127.0.0.1:$asset_port" sh
          INSTALL_ROOT="$XDG_DATA_HOME/surgepilot"
          SURGEPILOT="$HOME/.local/bin/surgepilot"
          anonymous_config=$(mktemp -d)
          cleanup() {
            cleanup_status=$?
            if [ "$cleanup_status" -ne 0 ]; then
              "$SURGEPILOT" logs || true
            fi
            kill "$asset_server_pid" 2>/dev/null || true
            rm -rf "$anonymous_config"
            "$SURGEPILOT" down || true
          }
          trap cleanup EXIT
          printf '{"auths":{}}\n' > "$anonymous_config/config.json"
          while IFS= read -r image; do
            if ! DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect "$image" >/dev/null; then
              echo "Validation image must allow anonymous pulls: $image" >&2
              exit 1
            fi
          done < <(jq -r '.images[] | "\(.repository)@\(.digest)"' "$INSTALL_ROOT/release-manifest.json")
          smoke_host=$(ip -4 route get 1.1.1.1 | awk '{for (i=1; i<=NF; i++) if ($i=="src") {print $(i+1); exit}}')
          test -n "$smoke_host"
          RUNNER_INTERNAL_TOKEN=validation-runner-token \
          SSH_CREDENTIAL_ENCRYPTION_KEY=MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= \
          python "$INSTALL_ROOT/scripts/bootstrap_deployment_env.py" \
            --root "$INSTALL_ROOT" \
            --release-http-port 8080 \
            --release-node-api-base-url "http://$smoke_host:8080" \
            --release-influxdb-host-port 8086 \
            --release-influxdb-node-write-url "http://$smoke_host:8086" \
            --release-demo-enabled true \
            --release-runtime-architectures auto \
            --session-cookie-secure false
          docker compose --env-file "$INSTALL_ROOT/.env" \
            -f "$INSTALL_ROOT/compose/docker-compose.yml" --profile demo config >/dev/null
          install -d -m 700 "$INSTALL_ROOT/.surgepilot" "$INSTALL_ROOT/.surgepilot/runtime-artifacts"
          cp validation-release-assets/surgepilot-runtime-linux-$RELEASE_ARCH-v0.0.0.* \
            "$INSTALL_ROOT/.surgepilot/runtime-artifacts/"
          "$SURGEPILOT" up
          uv sync --all-packages --all-groups
          SURGEPILOT_E2E_API_ORCHESTRATION_URL="http://$smoke_host:8080" \
          SURGEPILOT_E2E_TARGET_URL="http://$smoke_host:8080/api/healthz" \
          SURGEPILOT_E2E_INFLUXDB_QUERY_URL="http://$smoke_host:8086" \
          SURGEPILOT_E2E_INFLUXDB_TOKEN_FILE="$INSTALL_ROOT/.surgepilot/secrets/influxdb-token.secret" \
          SURGEPILOT_E2E_NODE_SSH_HOST=demo-load-node \
          SURGEPILOT_E2E_NODE_SSH_PORT=22 \
          SURGEPILOT_E2E_NODE_SSH_PASSWORD_FILE="$INSTALL_ROOT/.surgepilot/secrets/demo-load-node-password.secret" \
          make verify-p2-05-release-stack
