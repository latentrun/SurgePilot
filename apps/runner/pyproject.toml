[project]
name = "surgepilot-runner"
version = "1.2.0"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1.0,<9.0.0",
]

[dependency-groups]
dev = [
  "jsonschema>=4.23.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["surgepilot_runner"]
