[project]
name = "surgepilot-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "diff-cover>=9.7.0",
  "jsonschema>=4.23.0",
  "pytest>=8.3.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.8.0",
]

[tool.uv.workspace]
members = ["apps/api", "apps/runner"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/runner/tests", "tests"]
pythonpath = ["apps/api", "apps/runner"]
