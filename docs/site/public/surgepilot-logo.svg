<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0" />
    </radialGradient>

    <!-- Primary Facet Gradient -->
    <linearGradient id="facet-grad" x1="200" y1="100" x2="200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#006877" />
    </linearGradient>

    <!-- Highlight Overlay -->
    <linearGradient id="frosted-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3" />
      <stop offset="100%" stop-color="white" stop-opacity="0.05" />
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="cyan-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#0a0e1a" rx="32" />
  <circle cx="200" cy="200" r="180" fill="url(#bg-glow)" />

  <!-- Logo Group -->
  <g transform="translate(200, 200)" filter="url(#cyan-glow)">

    <!-- Center Hexagon -->
    <path d="M-20 -34.6 L20 -34.6 L40 0 L20 34.6 L-20 34.6 L-40 0 Z" fill="url(#facet-grad)" />
    <path d="M-20 -34.6 L0 -34.6 L20 0 L0 34.6 L-20 34.6 L-40 0 Z" fill="url(#frosted-white)" />

    <!-- 6 Faceted Arms -->
    <g id="arm-group">
      <!-- Arm 0 deg -->
      <g id="single-arm">
        <!-- Main Arm Body - Right Facet -->
        <path d="M0 -34.6 L24 -140 L0 -160 L0 -34.6 Z" fill="url(#facet-grad)" />
        <!-- Main Arm Body - Left Facet (Light/Frosted) -->
        <path d="M0 -34.6 L-24 -140 L0 -160 L0 -34.6 Z" fill="url(#facet-grad)" fill-opacity="0.8" />
        <path d="M0 -34.6 L-24 -140 L0 -160 L0 -34.6 Z" fill="url(#frosted-white)" />

        <!-- Side Branches -->
        <!-- Right Branch -->
        <path d="M12 -80 L45 -110 L45 -125 L18 -105 Z" fill="url(#facet-grad)" />
        <!-- Left Branch -->
        <path d="M-12 -80 L-45 -110 L-45 -125 L-18 -105 Z" fill="url(#facet-grad)" fill-opacity="0.8" />
        <path d="M-12 -80 L-45 -110 L-45 -125 L-18 -105 Z" fill="url(#frosted-white)" />
      </g>

      <!-- Radial Duplicates -->
      <use href="#single-arm" transform="rotate(60)" />
      <use href="#single-arm" transform="rotate(120)" />
      <use href="#single-arm" transform="rotate(180)" />
      <use href="#single-arm" transform="rotate(240)" />
      <use href="#single-arm" transform="rotate(300)" />
    </g>
  </g>
</svg>
