services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: surgepilot
      POSTGRES_USER: surgepilot
      POSTGRES_PASSWORD: surgepilot
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surgepilot -d surgepilot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
